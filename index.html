<!-- Fullscreen Image Modal -->
<div id="imgModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<script>
  // Get modal elements
  const modal = document.getElementById("imgModal");
  const modalImg = document.getElementById("modalImg");
  const closeBtn = document.querySelector(".close");

  // Use event delegation to catch clicks on dynamically loaded images
  document.addEventListener("click", (e) => {
    if (e.target.matches(".cert img, .block img")) {
      modal.style.display = "block";
      modalImg.src = e.target.src;
    }
  });

  // Close modal via the 'X' button
  if (closeBtn) {
    closeBtn.onclick = () => {
      modal.style.display = "none";
    };
  }

  // Close when clicking outside the image
  if (modal) {
    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    };
  }



<!-- Dynamic HTML Loader + Your Existing Tab/Modal Logic -->

    async function loadSections() {
        const elements = document.querySelectorAll('[data-include]');
        await Promise.all(
            Array.from(elements).map(async (el) => {
                const file = el.getAttribute('data-include');
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        el.innerHTML = await response.text();
                    } else {
                        console.error(`Failed to load ${file}: ${response.status}`);
                    }
                } catch (err) {
                    console.error(`Error fetching ${file}:`, err);
                }
            })
        );
    }

    // Load all section files as soon as the page opens
    document.addEventListener('DOMContentLoaded', loadSections);

    // Keep your existing showPage() and modal functions below
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }
</script>
